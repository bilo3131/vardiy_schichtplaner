# Referenzkopie von /etc/nginx/sites-available/schichtplaner (Stand: Oktober 2026)
# Die SSL-Zeilen werden von Certbot verwaltet.
server {
    server_name schichtplaner.vardiy.de;

    root /var/www/schichtplaner/frontend;
    index index.html index.csr.html;

    # Django Admin und API
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static und Media
    location /static/ { alias /var/www/schichtplaner/backend/staticfiles/; }
    location /media/  { alias /var/www/schichtplaner/backend/media/; }

    # Angular Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/schichtplaner.vardiy.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/schichtplaner.vardiy.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = schichtplaner.vardiy.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name schichtplaner.vardiy.de;
    return 404; # managed by Certbot
}
